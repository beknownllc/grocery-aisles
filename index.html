<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Aisle Walk</title>
<style>
:root{--bg:#f4f6f2;--surface:#fff;--ink:#17201c;--muted:#5d6b64;--line:#dde3dd;--accent:#1f6f5c;--accent-ink:#fff;--soft:#e4efe9;--warn:#b4531a;--warn-bg:#fbeadd;
--fa:#1e8a4c;--fb:#7fb83b;--fc:#e9b72c;--fd:#e2802a;--fe:#cf4a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101613;--surface:#19211d;--ink:#eaf1ec;--muted:#9fb0a6;--line:#2a3630;--accent:#4fb89c;--accent-ink:#06130e;--soft:#1f2e27;--warn:#f0a066;--warn-bg:#35241a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:1.15rem;margin:0;flex:1}
.pill{padding:6px 12px;border-radius:999px;background:var(--soft);font-weight:700;font-size:.85rem}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.search{width:100%;margin-top:8px;padding:11px 14px;font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.strip{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;padding:6px 10px;border-radius:10px;font-size:.78rem;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.step.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step.has::after{content:" •"}
main{padding:12px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));flex:1}
h2{font-size:1.4rem;margin:8px 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:11px 16px;border-radius:12px;background:var(--soft);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
ul{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.food{display:flex;align-items:stretch;width:100%;text-align:left;min-height:64px;border-radius:14px;background:var(--surface);border:2px solid var(--line);padding:0}
.food.jump,.food.plain{align-items:center;gap:12px;padding:14px}
.food .tick{flex:0 0 62px;display:grid;place-items:center;border-radius:12px 0 0 12px}
.food .body{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 0;text-align:left}
.food .chev{flex:0 0 auto;color:var(--muted);font-size:.8rem;transition:transform .15s}
.food .body[aria-expanded=true] .chev{transform:rotate(180deg)}
.detail{margin:-6px 4px 0;padding:14px;border:2px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:var(--surface)}
.dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 8px}
.dgrid div{font-size:.78rem;color:var(--muted)}
.dgrid b{display:block;font-size:1.05rem;color:var(--ink)}
.storectl{margin-top:10px;display:grid;gap:4px}
.dnote{margin-top:10px;font-size:.8rem;color:var(--muted)}
.food.sel{border-color:var(--accent);background:var(--soft)}
.food.flash{animation:fl 1.4s}
@keyframes fl{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.box{flex:0 0 28px;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:900;color:var(--accent-ink)}
.tick[aria-pressed=true] .box{background:var(--accent);border-color:var(--accent)}
.tick[aria-pressed=true] .box::after{content:"✓"}
.nm{flex:1;min-width:0;font-weight:700}
.nm small{display:block;font-weight:500;color:var(--muted);font-size:.82rem}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.7rem;font-weight:700;vertical-align:1px}
.fit{flex:0 0 auto;min-width:30px;text-align:center;padding:3px 8px;border-radius:8px;font-weight:800;font-size:.85rem;color:#fff}
.f9,.f10,.f8{background:var(--fa)}.f7{background:var(--fb)}.f6,.f5{background:var(--fc);color:#1d1a0a}.f4,.f3{background:var(--fd)}.f2,.f1,.f0{background:var(--fe)}
.food.got .nm{text-decoration:line-through;color:var(--muted)}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
nav.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
nav.bar .btn{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tally b{font-size:1.5rem;display:block}
.bar-track{height:8px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent)}
.warn{background:var(--warn-bg);color:var(--warn);padding:12px 14px;border-radius:12px;font-weight:600;margin:10px 0}
.cartrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cartrow:first-of-type{border-top:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;background:var(--soft);font-weight:800}
.sortl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.85rem;margin:0}.sortl select{width:auto;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.88rem}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{padding:24px 12px;text-align:center;color:var(--muted)}
input,select{font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
label{display:block;font-weight:700;font-size:.85rem;margin:8px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <h1>Aisle Walk</h1>
      <button class="pill" id="modeBtn" aria-label="Switch between planning and shopping"></button>
      <button class="pill" id="cartBtn" aria-label="Open cart"></button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search all foods" autocomplete="off" aria-label="Search all foods">
    <div class="row" style="margin-top:8px;justify-content:space-between"><label class="sortl">Store <select id="store" aria-label="Store"></select></label><button class="pill" id="orderBtn">Aisle order</button></div>
    <div class="warn" id="offline" hidden style="margin:8px 0 0;padding:8px 12px;font-size:.85rem">Offline. Your cart still works and saves on this device.</div>
    <div class="strip" id="strip" role="tablist"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="bar"><div class="in" id="nav"></div></nav>
<script src="foods.js"></script>
<script>
"use strict";
const BASE=["Produce","Bakery","Deli","Meat & seafood","Dairy & eggs","Frozen","Pantry","Snacks"];
const STORES={"Kroger":BASE.slice(),"Sam's Club":["Produce","Meat & seafood","Dairy & eggs","Deli","Bakery","Frozen","Pantry","Snacks"],"Walmart":["Produce","Deli","Bakery","Meat & seafood","Dairy & eggs","Frozen","Pantry","Snacks"]};
const BULK=new Set(["Meat & seafood","Dairy & eggs","Frozen","Pantry","Snacks"]);
let AISLES=BASE;
const PROTEIN_TARGET=[170,180], FIBER_TARGET=30, SNACK_MIN=1;
const KEY="aisle-walk-v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let S={cart:{},last:[],custom:[],mode:"plan",view:"aisle",aisle:0,q:"",sort:"fit",filters:[],store:"Kroger",orders:{},templates:[],unavail:{},pack:{},showHidden:false};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!STORES[S.store]) S.store="Kroger";
function orderFor(){const o=S.orders[S.store];return (o&&o.length===BASE.length&&BASE.every(a=>o.includes(a)))?o:STORES[S.store];}
AISLES=orderFor(); if(S.aisle<0||S.aisle>=AISLES.length) S.aisle=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

// foods: [id,name,aisle,fit,serving,protein,fiber,satfat]; custom: same shape with id "c1"...
function allFoods(){
  const base=window.FOODS.map(f=>({id:String(f[0]),name:f[1],aisle:f[2],fit:f[3],serving:f[4],p:f[5],fi:f[6],sf:f[7],kcal:f[8],carb:f[9],sug:f[10],na:f[11],grade:f[12],pd:f[13]}));
  const cu=S.custom.map(c=>({id:c.id,name:c.name,aisle:c.aisle,fit:null,serving:"",p:0,fi:0,sf:0,custom:true}));
  return base.concat(cu);
}
let FOODS=allFoods(), BYID=new Map(FOODS.map(f=>[f.id,f]));
function refresh(){FOODS=allFoods();BYID=new Map(FOODS.map(f=>[f.id,f]));}
const inCart=id=>!!S.cart[id];
const cartIds=()=>Object.keys(S.cart).filter(id=>BYID.has(id));
const fitBadge=f=>f==null?"":`<span class="fit f${f}" title="Fit ${f}/10">${f}</span>`;

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}

function totals(){
  let p=0,fi=0,snacks=0;
  for(const id of cartIds()){const f=BYID.get(id),q=S.cart[id].q||1;p+=f.p*q;fi+=f.fi*q;if(f.aisle==="Snacks")snacks++;}
  return {p:Math.round(p),fi:Math.round(fi),snacks};
}
const SORTS={fit:["Fit score",(x,y)=>(y.fit??-1)-(x.fit??-1)],protein:["Most protein",(x,y)=>y.p-x.p],fiber:["Most fiber",(x,y)=>y.fi-x.fi],satfat:["Lowest sat fat",(x,y)=>x.sf-y.sf],name:["A to Z",()=>0]};
const FILTERS={fit7:["Fit 7+",f=>f.fit>=7],protein:["15 g+ protein",f=>f.p>=15],lowsat:["Low sat fat",f=>f.sf<=1.5]};
const unList=()=>S.unavail[S.store]||[];
const isHidden=f=>unList().includes(f.id);
const packOf=f=>(S.pack[S.store]||{})[f.id]||"";
const visible=f=>S.showHidden||!isHidden(f);
const passes=f=>S.filters.every(k=>FILTERS[k]&&FILTERS[k][1](f));
function filterChips(){const n=unList().length;return `<div class="chips">${Object.entries(FILTERS).map(([k,v])=>`<button class="chip" data-filter="${k}" aria-pressed="${S.filters.includes(k)}">${v[0]}</button>`).join("")}${n?`<button class="chip" data-showhid="1" aria-pressed="${S.showHidden}">Show hidden (${n})</button>`:""}</div>`;}
function bySort(x,y){return (SORTS[S.sort]||SORTS.fit)[1](x,y)||((y.fit??-1)-(x.fit??-1))||x.name.localeCompare(y.name);}
function aisleItems(a){return FOODS.filter(f=>f.aisle===AISLES[a]).sort(S.sort==="name"?(x,y)=>x.name.localeCompare(y.name):bySort);}
function sortPicker(){return `<label class="sortl">Sort by <select id="sort">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${S.sort===k?"selected":""}>${v[0]}</option>`).join("")}</select></label>`;}
function counts(){const c={};for(const id of cartIds()){const a=BYID.get(id).aisle;c[a]=(c[a]||0)+1;}return c;}

function toggle(id){
  if(S.mode==="shop"){ if(S.cart[id]){S.cart[id].got=!S.cart[id].got;} }
  else if(S.cart[id]) delete S.cart[id]; else S.cart[id]={q:1,got:false};
  save();render(true);
}

function render(keepScroll){
  const y=window.scrollY;
  $("modeBtn").textContent=S.mode==="shop"?"Shopping":"Planning";
  $("modeBtn").className="pill"+(S.mode==="shop"?" on":"");
  $("cartBtn").textContent=`Cart ${cartIds().length}`;
  $("cartBtn").className="pill"+(S.view==="cart"?" on":"");
  renderStrip();
  if(S.q.trim()) renderSearch(); else if(S.view==="cart") renderCart(); else if(S.view==="order") renderOrder(); else renderAisle();
  if(keepScroll) window.scrollTo(0,y);
}

function renderStore(){
  $("store").innerHTML=Object.keys(STORES).map(s=>`<option ${s===S.store?"selected":""}>${esc(s)}</option>`).join("");
  $("orderBtn").className="pill"+(S.view==="order"?" on":"");
}
function renderOrder(){
  let h=`<h2>Aisle order: ${esc(S.store)}</h2><p class="sub">This is a typical layout. Move aisles to match the store you shop at.</p><ul>`+
   AISLES.map((a,i)=>`<li><div class="food plain" style="cursor:default"><span class="nm">${i+1}. ${esc(a)}</span><span class="qty"><button data-mv="${i}" data-d="-1" ${i===0?"disabled":""} aria-label="Move ${esc(a)} earlier">↑</button><button data-mv="${i}" data-d="1" ${i===AISLES.length-1?"disabled":""} aria-label="Move ${esc(a)} later">↓</button></span></div></li>`).join("")+`</ul><button class="btn ghost" id="resetOrder">Reset to typical order</button>`;
  $("main").innerHTML=h;
  $("nav").innerHTML=`<button class="btn primary" data-view="aisle">Done</button>`;
}
function setOrder(o){S.orders[S.store]=o;const cur=AISLES[S.aisle];AISLES=orderFor();S.aisle=Math.max(0,AISLES.indexOf(cur));save();render(true);}
function renderStrip(){
  renderStore();
  const c=counts();
  $("strip").innerHTML=AISLES.map((a,i)=>`<button class="step ${S.view==="aisle"&&!S.q.trim()&&S.aisle===i?"cur":""} ${c[a]?"has":""}" data-go="${i}" role="tab">${esc(a)}</button>`).join("");
  const cur=$("strip").querySelector(".cur"); if(cur&&cur.scrollIntoView) cur.scrollIntoView({inline:"center",block:"nearest"});
}

const expanded=new Set();
function storeCtl(f){
  return `<div class="storectl"><button class="btn ghost" data-unav="${f.id}">${isHidden(f)?"Mark as sold at "+esc(S.store):"Not sold at "+esc(S.store)}</button><label for="pk${f.id}">Pack size at ${esc(S.store)}</label><input id="pk${f.id}" data-pack="${f.id}" value="${esc(packOf(f))}" placeholder="Example: 3 lb tray" maxlength="30"></div>`;
}
function detail(f){
  if(f.custom) return `<div class="detail"><div class="dnote">You added this food, so there is no nutrition data for it.</div>${storeCtl(f)}</div>`;
  const cell=(l,v)=>`<div>${l}<b>${v}</b></div>`;
  return `<div class="detail"><div class="dgrid">${cell("Calories",f.kcal)}${cell("Protein",f.p+" g")}${cell("Carbs",f.carb+" g")}${cell("Fiber",f.fi+" g")}${cell("Sugar",f.sug+" g")}${cell("Sat fat",f.sf+" g")}${cell("Sodium",f.na+" mg")}${cell("Nutri-Score",f.grade)}${cell("Fit score",f.fit+"/10")}</div><div class="dnote">Per ${esc(f.serving)}. ${f.pd} g protein per 100 kcal.</div>${storeCtl(f)}</div>`;
}
function foodBtn(f){
  const sel=inCart(f.id), got=sel&&S.cart[f.id].got, ex=expanded.has(f.id);
  const last=S.last.includes(f.id)&&!sel&&S.mode==="plan"?`<span class="tag">last trip</span>`:"";
  const meta=f.custom?"Added by you":`${esc(f.serving)} · ${f.p} g protein`;
  const hid=isHidden(f)?`<span class="tag">not sold here</span>`:"", pk=packOf(f)?`<span class="tag">${esc(packOf(f))}</span>`:"";
  return `<li><div class="food ${sel?"sel":""} ${got?"got":""}"><button class="tick" data-id="${f.id}" aria-pressed="${sel}" aria-label="${S.mode==="shop"?"Check off":"Add"} ${esc(f.name)}"><span class="box" aria-hidden="true"></span></button><button class="body" data-exp="${f.id}" aria-expanded="${ex}"><span class="nm">${esc(f.name)}${last}${pk}${hid}<small>${meta}</small></span>${fitBadge(f.fit)}<span class="chev" aria-hidden="true">▼</span></button></div>${ex?detail(f):""}</li>`;
}

function renderAisle(){
  const a=S.aisle, name=AISLES[a];
  let items=aisleItems(a);
  if(S.mode==="shop") items=items.filter(f=>inCart(f.id)).sort((x,y)=>(S.cart[x.id].got-S.cart[y.id].got)||(S.sort==="name"?x.name.localeCompare(y.name):bySort(x,y)));
  if(S.mode==="plan") items=items.filter(f=>passes(f)&&visible(f));
  const left=items.filter(f=>!S.cart[f.id]?.got).length;
  const lastHere=aisleItems(a).filter(f=>S.last.includes(f.id)&&!inCart(f.id));
  let h=`<h2>${esc(name)}</h2><p class="sub">${S.mode==="shop"?(items.length?`${left} left to grab`:"Nothing on your cart in this aisle"):`${items.length} foods, sorted by ${S.sort==="name"?"name":(SORTS[S.sort]||SORTS.fit)[0].toLowerCase()}. Tap to add.`}</p>`;
  if(S.mode==="plan"&&lastHere.length) h+=`<button class="btn" id="readd">Re-add last trip (${lastHere.length})</button>`;
  if(S.mode==="shop"&&items.length) h+=`<button class="btn ghost" id="skip">Skip aisle</button>`;
  if(S.store==="Sam's Club"&&BULK.has(name)) h+=`<p class="sub">Sam's sells most of these in larger packs. Check the pack size before you add.</p>`;
  if(S.mode==="plan"){
    h+=filterChips();
  }
  if(items.length>1) h+=`<div class="row" style="margin-top:8px">${sortPicker()}</div>`;
  if(!items.length&&S.mode==="plan") h+=`<div class="empty">No foods in this aisle match your filters.</div>`;
  h+=`<ul>${items.map(f=>foodBtn(f)).join("")}</ul>`;
  $("main").innerHTML=h;
  const sel=$("sort"); if(sel) sel.onchange=()=>{S.sort=sel.value;save();render(true);};
  $("nav").innerHTML=`<button class="btn" data-nav="-1" ${a===0?"disabled":""}>Back</button>`+
    (a<AISLES.length-1?`<button class="btn primary" data-nav="1">Next: ${esc(AISLES[a+1])}</button>`:`<button class="btn primary" data-view="cart">Review cart</button>`);
}

function renderSearch(){
  const q=S.q.trim().toLowerCase();
  const res=FOODS.filter(f=>f.name.toLowerCase().includes(q)).filter(visible).sort(bySort).slice(0,40);
  let h=`<h2>Search</h2><p class="sub">${res.length} match${res.length===1?"":"es"} for “${esc(S.q.trim())}”. Tap a food to jump to its aisle.</p><ul>`+
    res.map(f=>`<li><button class="food jump" data-jump="${f.id}"><span class="box" aria-hidden="true"></span><span class="nm">${esc(f.name)}<small>${esc(f.aisle)}${f.serving?" · "+esc(f.serving):""}</small></span>${fitBadge(f.fit)}</button></li>`).join("")+`</ul>`;
  h+=`<button class="btn" data-custom="1">Not in the guide? Add “${esc(S.q.trim())}”</button>`;
  $("main").innerHTML=h;
  $("nav").innerHTML=`<button class="btn" id="clearq">Clear search</button>`;
}

function renderCart(){
  const ids=cartIds(), t=totals();
  const [lo,hi]=PROTEIN_TARGET;
  const pPct=Math.min(100,100*t.p/hi), fPct=Math.min(100,100*t.fi/FIBER_TARGET);
  let h=`<h2>Cart</h2><p class="sub">${ids.length} item${ids.length===1?"":"s"}. Set servings per day for each food.</p>`;
  h+=`<div class="card"><div class="tally"><div><b>~${t.p} g</b>protein / day<div class="bar-track"><i style="width:${pPct}%"></i></div><small>Weekday target ${lo}-${hi} g</small></div><div><b>~${t.fi} g</b>fiber / day<div class="bar-track"><i style="width:${fPct}%"></i></div><small>Target ${FIBER_TARGET} g+</small></div></div></div>`;
  if(ids.length&&t.p<lo) h+=`<div class="warn">Your picks cover about ${t.p} g protein a day. Add proteins or raise servings to reach ${lo} g.</div>`;
  if(ids.length&&t.snacks<SNACK_MIN) h+=`<div class="warn">No snacks in your cart. Add at least ${SNACK_MIN} so you don't run out.</div>`;
  if(!ids.length) h+=`<div class="empty">Your cart is empty. Walk the aisles and tap foods to add them.</div>`;
  for(const a of AISLES){
    const its=ids.map(id=>BYID.get(id)).filter(f=>f.aisle===a);
    if(!its.length) continue;
    h+=`<div class="card"><b>${esc(a)}</b>`+its.map(f=>{const q=S.cart[f.id].q||1;return `<div class="cartrow"><span class="nm">${esc(f.name)}${isHidden(f)?`<span class="tag">not sold at ${esc(S.store)}</span>`:""}<small>${f.serving?esc(f.serving)+" · ":""}${Math.round(f.p*q)} g protein/day</small></span><span class="qty"><button data-q="${f.id}" data-d="-1" aria-label="Fewer servings of ${esc(f.name)}">−</button><span>${q}×</span><button data-q="${f.id}" data-d="1" aria-label="More servings of ${esc(f.name)}">+</button></span><button class="btn ghost" data-rm="${f.id}" aria-label="Remove ${esc(f.name)}">✕</button></div>`;}).join("")+`</div>`;
  }
  if(S.mode==="plan"){
    h+=`<div class="card"><b>Saved trips</b>`+(S.templates.length?S.templates.map(t=>`<div class="cartrow"><span class="nm">${esc(t.name)}<small>${t.items.length} items</small></span><button class="btn" data-tload="${t.id}">Load</button><button class="btn ghost" data-tadd="${t.id}">Add</button><button class="btn ghost" data-tdel="${t.id}" aria-label="Delete ${esc(t.name)}">✕</button></div>`).join(""):`<p class="sub" style="margin:8px 0">Save this cart, like "heavy lift week", to reload it later.</p>`)+
      `<label for="tname">Name this cart</label><div class="row"><input id="tname" placeholder="Heavy lift week" style="flex:1"><button class="btn primary" id="tsave" ${ids.length?"":"disabled"}>Save</button></div></div>`;
  }
  $("main").innerHTML=h;
  $("nav").innerHTML=S.mode==="shop"
    ? `<button class="btn" data-view="aisle">Back to aisles</button><button class="btn primary" id="finish">Finish trip</button>`
    : `<button class="btn" data-view="aisle">Back to aisles</button><button class="btn primary" id="startShop" ${ids.length?"":"disabled"}>Start shopping</button>`;
}

function customForm(name){
  $("main").innerHTML=`<h2>Add a food</h2><p class="sub">It will be saved in your aisle for next time.</p><label for="cn">Name</label><input id="cn" value="${esc(name)}"><label for="ca">Aisle</label><select id="ca">${AISLES.map(a=>`<option>${esc(a)}</option>`).join("")}</select>`;
  $("nav").innerHTML=`<button class="btn" id="cancelc">Cancel</button><button class="btn primary" id="savec">Add to cart</button>`;
  $("savec").onclick=()=>{
    const n=$("cn").value.trim(); if(!n) return;
    const id="c"+Date.now().toString(36);
    S.custom.push({id,name:n,aisle:$("ca").value}); S.cart[id]={q:1,got:false};
    S.q="";$("q").value=""; refresh(); S.aisle=AISLES.indexOf($("ca").value); S.view="aisle"; save(); render(); toast("Added");
  };
  $("cancelc").onclick=()=>render();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.id){return toggle(t.dataset.id);}
  if(t.dataset.unav){const id=t.dataset.unav,l=unList().slice();const i=l.indexOf(id);i>=0?l.splice(i,1):l.push(id);S.unavail[S.store]=l;save();return render(true);}
  if(t.dataset.showhid){S.showHidden=!S.showHidden;save();return render(true);}
  if(t.dataset.exp){const k=t.dataset.exp;expanded.has(k)?expanded.delete(k):expanded.add(k);return render(true);}
  if(t.dataset.filter){const k=t.dataset.filter;S.filters=S.filters.includes(k)?S.filters.filter(x=>x!==k):S.filters.concat(k);save();return render(true);}
  if(t.dataset.mv){const i=+t.dataset.mv,j=i+ +t.dataset.d,o=AISLES.slice();if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];return setOrder(o);}
  if(t.id==="resetOrder"){delete S.orders[S.store];const cur=AISLES[S.aisle];AISLES=orderFor();S.aisle=Math.max(0,AISLES.indexOf(cur));save();return render(true);}
  if(t.id==="orderBtn"){S.view=S.view==="order"?"aisle":"order";S.q="";$("q").value="";save();render();return window.scrollTo(0,0);}
  if(t.id==="tsave"){const n=$("tname").value.trim()||("Trip "+(S.templates.length+1));S.templates.push({id:"t"+Date.now().toString(36),name:n,items:cartIds().map(id=>({id,q:S.cart[id].q||1}))});save();render(true);return toast("Saved");}
  if(t.dataset.tload||t.dataset.tadd){const tp=S.templates.find(x=>x.id===(t.dataset.tload||t.dataset.tadd));if(!tp)return;
    if(t.dataset.tload)S.cart={};let miss=0;for(const it of tp.items){if(BYID.has(it.id))S.cart[it.id]={q:it.q,got:false};else miss++;}
    save();render(true);return toast(miss?`Loaded. ${miss} custom item${miss>1?"s":""} no longer exist.`:"Loaded");}
  if(t.dataset.tdel){S.templates=S.templates.filter(x=>x.id!==t.dataset.tdel);save();return render(true);}
  if(t.dataset.go!==undefined){S.aisle=+t.dataset.go;S.view="aisle";S.q="";$("q").value="";save();render();return window.scrollTo(0,0);}
  if(t.dataset.nav){S.aisle+=+t.dataset.nav;save();render();return window.scrollTo(0,0);}
  if(t.dataset.view){S.view=t.dataset.view;save();render();return window.scrollTo(0,0);}
  if(t.dataset.jump){const f=BYID.get(t.dataset.jump);S.aisle=AISLES.indexOf(f.aisle);S.view="aisle";S.q="";$("q").value="";save();render();
    const el=document.querySelector(`[data-id="${f.id}"]`); if(el){expanded.add(f.id);render(true);const el2=document.querySelector(`[data-id="${f.id}"]`);const row=el2.closest(".food");row.scrollIntoView({block:"center"});row.classList.add("flash");} return;}
  if(t.dataset.custom){return customForm(S.q.trim());}
  if(t.dataset.q){const c=S.cart[t.dataset.q];c.q=Math.max(1,Math.min(6,(c.q||1)+ +t.dataset.d));save();return render(true);}
  if(t.dataset.rm){delete S.cart[t.dataset.rm];save();return render(true);}
  if(t.id==="readd"){let n=0;for(const f of aisleItems(S.aisle)) if(S.last.includes(f.id)&&!inCart(f.id)){S.cart[f.id]={q:1,got:false};n++;} save();render(true);return toast(`Added ${n}`);}
  if(t.id==="skip"){if(S.aisle<AISLES.length-1){S.aisle++;}else S.view="cart";save();render();return window.scrollTo(0,0);}
  if(t.id==="clearq"){S.q="";$("q").value="";return render();}
  if(t.id==="startShop"){S.mode="shop";S.view="aisle";const c=counts();S.aisle=Math.max(0,AISLES.findIndex(a=>c[a]));for(const id in S.cart)S.cart[id].got=false;save();render();return window.scrollTo(0,0);}
  if(t.id==="finish"){
    if(!confirm("Finish this trip? Your cart clears and these foods are tagged 'last trip' next time.")) return;
    S.last=cartIds();S.cart={};S.mode="plan";S.view="aisle";S.aisle=0;save();render();return toast("Trip saved. Cart cleared.");
  }
  if(t.id==="modeBtn"){S.mode=S.mode==="shop"?"plan":"shop";if(S.mode==="shop"){for(const id in S.cart)S.cart[id].got=false;const c=counts();S.aisle=Math.max(0,AISLES.findIndex(a=>c[a]));}S.view="aisle";save();render();return window.scrollTo(0,0);}
  if(t.id==="cartBtn"){S.view=S.view==="cart"?"aisle":"cart";S.q="";$("q").value="";save();render();return window.scrollTo(0,0);}
});
document.addEventListener("change",e=>{const i=e.target.closest&&e.target.closest("[data-pack]");if(!i)return;const m=S.pack[S.store]||(S.pack[S.store]={});const v=i.value.trim();if(v)m[i.dataset.pack]=v;else delete m[i.dataset.pack];save();render(true);});
$("q").addEventListener("input",e=>{S.q=e.target.value;render();});
$("q").value="";S.q="";
$("store").addEventListener("change",e=>{const cur=AISLES[S.aisle];S.store=e.target.value;AISLES=orderFor();S.aisle=Math.max(0,AISLES.indexOf(cur));save();render();});
function netState(){$("offline").hidden=navigator.onLine!==false;}
window.addEventListener("online",netState);window.addEventListener("offline",netState);netState();
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
